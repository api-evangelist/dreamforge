aid: dreamforge
name: Dreamforge
description: >-
  DreamForge.ai is an AI-powered game creation platform for building, iterating
  on, and publishing 2D and stylized 3D games directly in the browser. Creators
  use AI to generate gameplay systems, game-ready art and textures, animation,
  and playable web builds, then share public play pages under dreamforge.ai/play.
  The platform pairs a creator-facing web studio (including an Asset Studio) with
  a consumer application distributed on Steam, iOS, and Android. Founded in 2025
  and based in Miami, Florida, DreamForge is backed by Andreessen Horowitz (a16z).
  DreamForge supports stylized 3D world generation, textures, voxels, and
  billboarding workflows; native 3D model generation is not currently provided.
  No public developer API, SDK, or developer portal is published at this time.
